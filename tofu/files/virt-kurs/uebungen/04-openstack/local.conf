[[local|localrc]]
# Nur fuer das Labor in dieser VM. Die Passwoerter sind bewusst schlicht.
ADMIN_PASSWORD=labor-geheim
DATABASE_PASSWORD=$ADMIN_PASSWORD
RABBIT_PASSWORD=$ADMIN_PASSWORD
SERVICE_PASSWORD=$ADMIN_PASSWORD

# Wie Nova die Instanzen startet. qemu (Emulation) geht immer; zeigt
# /etc/nested-vm/accel "kvm", hier kvm eintragen - das ist viel schneller.
LIBVIRT_TYPE=qemu
